services:
  mysql:
    image: mysql:8.0
    container_name: apap-backend-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-APAP2026}
      MYSQL_DATABASE: ${DB_NAME:-abnormal_alarm}
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-APAP2026}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
