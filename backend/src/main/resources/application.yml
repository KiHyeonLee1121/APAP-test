server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: apap-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:abnormal_alarm}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true

apap:
  ai-server-url: ${AI_SERVER_URL:http://localhost:8000}
  base-url: ${BASE_URL:http://localhost:8080}
  upload-dir: uploads
  google:
    # Google OIDC client ID (Google Cloud Console > OAuth 2.0 Client ID)
    client-id: ${GOOGLE_CLIENT_ID:}
  jwt:
    # JWT signing secret for HS256. Use at least 32 bytes in production.
    secret: ${JWT_SECRET:}
    # Access token expiration time in milliseconds. Default is 24 hours.
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
