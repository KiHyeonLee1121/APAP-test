server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:apap;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false

apap:
  ai-server-url: http://localhost:18000
  base-url: http://localhost:8080
  upload-dir: build/test-uploads
  google:
    client-id: test-client-id
  jwt:
    secret: test-jwt-secret-key-must-be-at-least-32-bytes-long-1234567890
    expiration-ms: 86400000
